# Production profile (activate with SPRING_PROFILES_ACTIVE=prod)
#
# Defaults use current Cloud Run URLs; override any value with the same-named env var.

server.port=${PORT:8085}

# Public HTTPS origin of this catalog service (used in image/media URLs)
catalog.product-images.public-base-url=${CATALOG_PUBLIC_BASE_URL:https://catalog-1089274910156.asia-south1.run.app}
catalog.media.public-base-url=${CATALOG_PUBLIC_BASE_URL:https://catalog-1089274910156.asia-south1.run.app}

# Comma-separated browser origins (set when ecart / catalog-admin are deployed)
catalog.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://catalog-admin-ui-1089274910156.asia-south1.run.app,https://ecart-ui-1089274910156.asia-south1.run.app}

# Sibling service base URLs (no trailing slash)
party.service.base-url=${PARTY_SERVICE_BASE_URL:https://party-service-1089274910156.asia-south1.run.app}
pricing.service.base-url=${PRICING_SERVICE_BASE_URL:https://pricing-1089274910156.asia-south1.run.app}

# Safer defaults than local
spring.h2.console.enabled=false
spring.jpa.show-sql=false

# Shared Cloud SQL MySQL (instance: playpro, database: playdb) — same for all backends.
# Set MYSQL_PASSWORD (and optionally CLOUD_SQL_INSTANCE) on Cloud Run / Secret Manager.
# Attach the Cloud SQL instance "playpro" to each Cloud Run service.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql:///${MYSQL_DATABASE:playdb}?cloudSqlInstance=${CLOUD_SQL_INSTANCE:project-3e935033-4ac7-4904-bad:asia-south1:playpro}&socketFactory=com.google.cloud.sql.mysql.SocketFactory&useSSL=false&serverTimezone=UTC&characterEncoding=utf8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:playpro_user}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${MYSQL_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${MYSQL_POOL_MIN_IDLE:2}
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.table=flyway_schema_history_catalog
