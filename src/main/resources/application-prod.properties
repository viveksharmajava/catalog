# Production profile (activate with SPRING_PROFILES_ACTIVE=prod)
#
# Set the env vars below on each Cloud Run / Docker service.
# Spring maps ENV_VAR names to these ${...} placeholders.

server.port=${PORT:8080}

# Public HTTPS origin of this catalog service (used in image/media URLs)
catalog.product-images.public-base-url=${CATALOG_PUBLIC_BASE_URL}
catalog.media.public-base-url=${CATALOG_PUBLIC_BASE_URL}

# Comma-separated browser origins (ecart + catalog-admin)
catalog.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Sibling service base URLs (no trailing slash)
party.service.base-url=${PARTY_SERVICE_BASE_URL}
pricing.service.base-url=${PRICING_SERVICE_BASE_URL}

# Safer defaults than local
spring.h2.console.enabled=false
spring.jpa.show-sql=false

# Optional: switch off H2 later (Cloud SQL)
# spring.datasource.url=${SPRING_DATASOURCE_URL}
