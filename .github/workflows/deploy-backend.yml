name: Deploy Spring Boot to GCP

on:
  push:
    branches:
      - main # Change this if your default branch is master

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull down the source code from GitHub
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Log in securely to GCP using your saved Service Account JSON Key
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 3. Configure Docker to safely talk to your specific Artifact Registry region
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev

      # 4. Set up Java Environment on the GitHub Runner
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven' # Automatically caches dependencies for faster subsequent builds

      # 5. Build the Spring Boot executable package
      - name: Build Application Jar
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      # 6. Build the container image and upload it straight to Google Cloud
      - name: Build and Push Docker Image
        run: |
          docker build -t us-central1-docker.pkg.dev/project-3e935033-4ac7-4904-bad/ecommerce-apps/catalog-service:latest .
          docker push us-central1-docker.pkg.dev/$project-3e935033-4ac7-4904-bad/ecommerce-apps/catalog-service:latest

